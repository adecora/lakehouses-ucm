# The main pipeline for lakehouses_ucm

resources:
  pipelines:
    lakehouses_ucm_etl:
      name: lakehouses_ucm_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/lakehouses_ucm_etl"

      libraries:
        - glob:
            include: ../src/lakehouses_ucm_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
