# This is a Declarative Automation Bundle definition for lakehouses_ucm.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lakehouses_ucm
  uuid: 30fefbd0-c73e-448e-92f3-a25b331201f8

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405614992691538.18.azuredatabricks.net
    variables:
      catalog: adbmade01alvare05
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405614992691538.18.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/alvare05@ucm.es to make sure we only have a single copy.
      root_path: /Workspace/Users/alvare05@ucm.es/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: adbmade01alvare05
      schema: prod
    permissions:
      - user_name: alvare05@ucm.es
        level: CAN_MANAGE
